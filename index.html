<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>学園祭ライブ | セットリスト表示</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; color:#fff; text-align:center; padding:15px; font-size:16px;}
body.day1 { background: linear-gradient(135deg, #ff8c00, #ff3c78, #ffd700); }
body.day2 { background: linear-gradient(0deg,#e5d971,#b4d76c,#57ac67); }
body.stage { background: linear-gradient(135deg, #000 0%, #000 50%, #d4af37 50%, #d4af37 80%, #fff 80%, #fff 90%, #ff0000 90%, #ff0000 100%); }
h1{font-size:1.8em;margin-bottom:10px;}
#current{font-size:1.4em;margin-top:15px;}
#next{font-size:1.2em;margin-top:10px;}
.card{ background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding:15px; border-radius:15px; max-width:100%; margin:0 auto;}
select{ width:100%; padding:8px; font-size:1.2em; border-radius:8px; border:none; margin-top:8px;}
.table-container { overflow-x:auto; margin-top:15px; }
table { width:100%; border-collapse:collapse; color:#000; background: rgba(255,255,255,0.85); border-radius:8px; overflow:hidden;}
td,th { padding:8px; border-bottom:1px solid rgba(0,0,0,0.08); text-align:left; white-space: nowrap; }
button { margin-left:10px; }
.finished { color: gray; }
.playing { color: blue; }
.upcoming { color: black; }
.map img { width:100%; max-width:600px; display:block; margin:10px auto; }
</style>
</head>
<body>
<h1>学園祭ライブ セットリスト</h1>

<div class="map">
  images/map_day.png
</div>

<div class="card">
  <p>日付を選択：</p>
  <select id="daySelect">
    <option value="Day1">Day1</option>
    <option value="Day2">Day2</option>
    <option value="ステージ発表">ステージ発表</option>
  </select>
  <div id="current">読み込み中...</div>
  <div id="next"></div>
  <div class="table-container"><table id="table"></table></div>
</div>

<script>
// ======= 設定 =======
const SHEET_ID = "1V0cVVTlYwR1QigjIL1OG2F62f7btDg_GiWhdqBq6Aq4";
const DAY1_DATE = "2025-11-22";
const DAY2_DATE = "2025-11-23";
const LIVE_END_MINUTES = 16*60+30; // 16:30
const STAGE_START_MINUTES = 14*60+30; // 15:00

const TEST_MODE = false;
const TEST_DATE = "2025-11-22 15:30";

function getNow(){
    if(TEST_MODE){
        const [date,time]=TEST_DATE.split(" ");
        const [y,m,d]=date.split("-").map(Number);
        const [hh,mm]=time.split(":").map(Number);
        return new Date(y,m-1,d,hh,mm);
    }
    return new Date();
}

function setBackground(mode){
    const body=document.body;
    body.classList.remove("day1","day2","stage");
    const mapImg=document.getElementById("mapImg");
    if(mode==="Day1"){ body.classList.add("day1"); mapImg.src="images/map_day.png"; }
    else if(mode==="Day2"){ body.classList.add("day2"); mapImg.src="images/map_day.png"; }
    else if(mode==="ステージ発表"){ body.classList.add("stage"); mapImg.src="images/map_stage.png"; }
}

let firstLoad=true;
let rows=[];
let clickCounts={};

function load(day, now){
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${day}`;
    return fetch(url)
        .then(r=>r.text())
        .then(t=>{ render(t, day, now); })
        .catch(()=>{ document.getElementById("current").innerText="読み込み失敗"; });
}

function autoSelectSheet(){
    const scrollY=window.scrollY;
    let now=getNow();
    let sheet;
    const savedSheet=sessionStorage.getItem('selectedSheet');
    if(savedSheet){ sheet=savedSheet; firstLoad=false; }
    else if(firstLoad){
        const todayStr=now.toISOString().split("T")[0];
        if(todayStr===DAY1_DATE){ sheet="Day1"; }
        else if(todayStr===DAY2_DATE){
            const min=now.getHours()*60+now.getMinutes();
            sheet=(min>=STAGE_START_MINUTES)?"ステージ発表":"Day2";
        } else { sheet="Day1"; }
        firstLoad=false;
    } else { sheet=document.getElementById("daySelect").value; }

    document.getElementById("daySelect").value=sheet;
    setBackground(sheet);
    load(sheet, now).then(()=>{ window.scrollTo(0, scrollY); });
}

function handleClick(index){
    clickCounts[index]=(clickCounts[index]||0)+1;
    const infoId=`info-${index}`;
    const now=getNow();
    if(clickCounts[index]===1){
        const day=document.getElementById("daySelect").value;
        const baseTime=new Date(2025,10,(day==="Day1"?22:23),8,0);
        const diffMs=now-baseTime;
        const hours=Math.floor(diffMs/3600000);
        const mins=Math.floor((diffMs%3600000)/60000);
        const lastEnd=rows[rows.length-1][0];
        const [h,m]=lastEnd.split(":").map(Number);
        const endTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
        if(now>endTime) return;
        const info=document.createElement('tr');
        info.id=infoId;
        info.innerHTML=`<td colspan="3">開始から ${hours}時間${mins}分経過</td>`;
        document.querySelector(`#table tr:nth-child(${index+2})`).insertAdjacentElement('afterend', info);
    } else if(clickCounts[index]===2){
        document.getElementById(infoId)?.remove();
        clickCounts[index]=0;
    }
}

function processNormal(rows,currentMinutes){
    let current=null,next=null;
    rows.forEach(r=>{
        const [t,band,song]=r;if(!t)return;
        const start=parseInt(t.split(":")[0])*60+parseInt(t.split(":")[1]);
        if(start<=currentMinutes)current={time:t,band,song};
        else if(!next)next={time:t,band,song};
    });
    if(current&&current.band==="休憩時間"){
        current.band="休憩中";current.song="";
        for(let i=0;i<rows.length;i++){
            const [t,b,s]=rows[i];
            if(parseInt(t.split(":")[0])*60+parseInt(t.split(":")[1])>currentMinutes&&b!=="休憩時間"){
                next={time:t,band:b,song:s};break;
            }
        }
    }
    let text="",nextText="";
    if(current){
        if(current.band==="休憩中")text+="🛋️ 現在：休憩中<br>";
        else text+=`🎵 現在演奏中：${current.song}<br>バンド名: ${current.band}<br>`;
    } else text+="始まりまでお待ちください。<br>";
    if(next){
        if(next.band==="休憩時間")nextText=`⏭️ 次：休憩時間<br>休憩開始予定時刻: ${next.time}〜`;
        else nextText=`⏭️ 次の演奏曲：${next.song}<br>バンド名: ${next.band}<br>次のバンドの開始予定時刻: ${next.time}〜`;
    } else nextText="⏭️ 次の演奏予定：なし";
    document.getElementById("current").innerHTML=text;
    document.getElementById("next").innerHTML=nextText;
}

function render(csv,dayLabel,now){
    const lines=csv.trim().split(/\r?\n/).map(l=>l.split(","));
    const header=lines[0].map(c=>c.replace(/^"|"$/g,""));
    rows=lines.slice(1).map(r=>r.map(c=>c.replace(/^"|"$/g,"")));
    let html="<tr>";header.forEach(h=>html+=`<th>${h}</th>`);html+="</tr>";
    rows.forEach((r,i)=>{
        const time=r[0],band=r[1],song=r[2];
        html+=`<tr class="upcoming"><td>${time}</td><td>${band} <button onclick="handleClick(${i})">チェック</button></td><td>${song}</td></tr>`;
    });
    document.getElementById("table").innerHTML=html;
    const currentMinutes=now.getHours()*60+now.getMinutes();
    document.querySelectorAll("#table tr").forEach((tr,i)=>{
        if(i===0)return;
        const start=parseInt(rows[i-1][0].split(":")[0])*60+parseInt(rows[i-1][0].split(":")[1]);
        if(start<currentMinutes)tr.className="finished";
        else if(Math.abs(start-currentMinutes)<30)tr.className="playing";
        else tr.className="upcoming";
    });
    processNormal(rows,currentMinutes);
}

document.getElementById("daySelect").onchange=e=>{
    const v=e.target.value;
    setBackground(v);
    load(v,getNow());
};

autoSelectSheet();
setInterval(()=>{autoSelectSheet();},30000);
</script>
</body>
</html>
